[project]
name = "data-control-plane"
version = "0.2.0"
description = "FastAPI control plane: orchestrates Databricks jobs and AWS Lambdas, tracks runs in DynamoDB."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "boto3==1.43.40",
    "botocore==1.43.40",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
